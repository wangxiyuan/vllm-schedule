<!DOCTYPE html>
<html lang="zh" style="color-scheme:dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0e14">
<title>vLLM KV Cache 排布与逻辑↔物理映射</title>
<style>
/* THEME: kv_layout.py injects the shared scheduler-theme CSS here. */

:root{
  --bg:#0b0e14; --panel:#121724; --panel2:#171e2e; --panel3:#1d2638;
  --line:#26304a; --line2:#33405f;
  --txt:#dbe4f5; --muted:#8494b0; --faint:#5d6b85;
  --accent:#4f8ff7; --accent2:#7ab0ff;
  --cpu:#4f8ff7; --gpu:#b07cf7; --py:#ffb84f;
  --ok:#35d07f; --warn:#ffc53d; --err:#ff6b6b; --preempt:#ff5f5f;
  --null:#ff7a9c;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.55 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:18px;max-width:1280px;margin:0 auto;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1{font-size:19px;text-wrap:balance}
h2{font-size:15px;text-wrap:balance;scroll-margin-top:12px}
h3,h4{font-size:13px;scroll-margin-top:12px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:6px}
a.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;z-index:99}
a.skip:focus{left:8px}
.sub{color:var(--muted);font-size:12px;margin:4px 0 14px}
.tnum{font-variant-numeric:tabular-nums}
.badge{font-size:11px;padding:3px 9px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge b{color:var(--txt)}

/* ---------- guide ---------- */
.guide{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.guide-head{width:100%;text-align:left;padding:10px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--accent2)}
.guide-head:hover{background:var(--panel2)}
.guide-head .arrow{margin-left:auto;transition:transform .2s ease}
.guide-head.open .arrow{transform:rotate(90deg)}
.guide-body{padding:2px 14px 14px;font-size:12px;color:#c3cee0}
.guide-body p{margin-bottom:8px;line-height:1.65}
.guide-body code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
.glossary{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px;margin-top:8px}
.gcell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.55}
.gcell b{color:var(--accent2)}
.guide-body kbd{background:var(--panel3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:10px;font-family:ui-monospace,monospace}

/* ---------- scene bar ---------- */
.scenebar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.grp{color:var(--faint);font-size:11px;margin:0 6px;letter-spacing:.04em;white-space:nowrap}
.tab{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--muted)}
.tab:hover{background:var(--panel2);color:var(--txt)}
.tab.active{font-weight:600;color:var(--txt);border-color:var(--accent);background:rgba(79,143,247,.12)}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.scene-nav{display:flex;gap:6px}
.scene-nav button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px}
.scene-nav button:hover{background:var(--panel2);color:var(--txt)}
.scene-nav button:disabled{opacity:.4;cursor:default}

/* ---------- story ---------- */
.story{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.story .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.story-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;letter-spacing:.05em;background:rgba(79,143,247,.15);color:var(--accent2);border:1px solid var(--accent)}
.story-badge.init{background:rgba(125,138,165,.18);color:var(--muted);border-color:var(--line2)}
.story-badge.loop{background:rgba(255,107,107,.15);color:var(--err);border-color:var(--err)}
.story-badge.done{background:rgba(53,208,127,.15);color:var(--ok);border-color:var(--ok)}
.story-title{font-size:15px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.loopbadge{font-size:12px;padding:3px 10px;border-radius:10px;white-space:nowrap}
.loopbadge.loop{background:rgba(255,107,107,.15);color:var(--err)}
.loopbadge.done{background:rgba(53,208,127,.15);color:var(--ok)}
.expl{list-style:none;margin-top:2px}
.expl li{font-size:12.5px;color:#c3cee0;padding:3px 0 3px 12px;border-left:2px solid var(--line2);margin:5px 0}
.expl li b{color:var(--txt)}
.expl li code{background:var(--panel3);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
.evchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.evchip{font-size:11px;padding:3px 9px;border-radius:10px;border:1px solid}
.evchip.scheduled{border-color:var(--ok);background:rgba(53,208,127,.1);color:var(--ok)}
.evchip.preempted{border-color:var(--preempt);background:rgba(255,95,95,.1);color:var(--preempt)}
.evchip.finished{border-color:var(--muted);background:rgba(132,148,176,.12);color:var(--muted)}
.evchip b{color:#fff}

/* ---------- controls ---------- */
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;touch-action:manipulation}
.controls button{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:13px}
.controls button:hover{background:var(--panel3)}
.controls button.play{background:rgba(53,208,127,.15);border-color:var(--ok);color:var(--ok);font-weight:600;min-width:96px}
.controls button.icon{min-width:40px}
.speed{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-left:4px}
.speed select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 8px;font-size:12px}
.stepinfo{font-size:12.5px;color:var(--muted);margin-left:auto;overflow-wrap:anywhere}
.stepinfo b{color:var(--txt)}
.keyhint{font-size:10.5px;color:var(--faint);margin-left:auto}
.keyhint kbd{background:var(--panel3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:10px;font-family:ui-monospace,monospace}

/* ---------- scrubber + markers ---------- */
.scrub{margin-bottom:14px}
#range{width:100%;accent-color:var(--accent);display:block}
.markers{display:flex;gap:3px;margin-top:7px;align-items:center;min-height:14px}
.pip{flex:1;height:10px;border-radius:3px;padding:0;min-width:0;border:1px solid var(--line);background:var(--panel3);opacity:.85}
.pip:hover{opacity:1;transform:scaleY(1.5);transition:transform .12s ease,opacity .12s ease}
.pip.active{outline:2px solid var(--accent2);outline-offset:1px;opacity:1}
.pip.mk-sched{background:var(--cpu)}
.pip.mk-spec{background:var(--gpu)}
.pip.mk-preempt{background:var(--preempt)}
.pip.mk-finish{background:var(--muted)}
.pip.mk-done{background:var(--ok)}
.pip.mk-loop{background:repeating-linear-gradient(45deg,var(--err),var(--err) 3px,var(--panel3) 3px,var(--panel3) 6px)}
.mklegend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--faint);margin-left:auto}
.mklegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.scrub-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:5px}

/* ---------- stable stage ---------- */
/* Fixed-height "canvas": the page height never changes while stepping, so the
   viewport cannot jump. Content overflows inside the stage instead. */
.stage{height:clamp(460px,66vh,760px);overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);padding:12px 14px;margin-bottom:12px}
.stage.flow{height:auto;overflow:visible;overscroll-behavior:auto;border:none;border-radius:0;padding:0;background:transparent}
.stage .story{margin-bottom:12px}
.stage .legendbar{margin-bottom:0}

/* ---------- worlds ---------- */
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.panel-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.panel-head h3{font-size:13px}
.panel-head .hint{margin-left:auto;font-size:10.5px;color:var(--faint)}
.tag{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:700;letter-spacing:.03em}
.tag.cpu{background:rgba(79,143,247,.15);color:var(--cpu);border:1px solid var(--cpu)}
.tag.gpu{background:rgba(176,124,247,.15);color:var(--gpu);border:1px solid var(--gpu)}
.budget{font-size:11px;color:var(--muted);margin-bottom:10px}
.budget b{color:var(--txt)}
.delta{font-size:10px;padding:1px 7px;border-radius:8px;background:rgba(53,208,127,.1);color:var(--ok);border:1px solid rgba(53,208,127,.35);white-space:nowrap}
.delta.warn{background:rgba(255,197,61,.1);color:var(--warn);border-color:rgba(255,197,61,.35)}
h4{font-size:12px;color:var(--accent2);margin:12px 0 6px;font-weight:600}
h4 .hint{font-weight:400;color:var(--faint);font-size:10.5px;margin-left:6px}

/* queues */
.queues{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.q{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.qlabel{font-size:10.5px;color:var(--faint);display:block;margin-bottom:4px;letter-spacing:.03em}
.qlabel .cap{color:var(--muted)}
.qbody{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.qchip{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--panel3);border:1px solid var(--line);overflow-wrap:anywhere}
.qchip.new{animation:qin .5s ease}
@keyframes qin{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
.qchip.leave{opacity:.35;text-decoration:line-through}

/* request cards */
.reqlist{display:flex;flex-direction:column;gap:6px}
.req{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:block}
.req:hover{border-color:var(--line2)}
.req.sel{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2)}
.req.sched{animation:flash 1.2s ease 2;border-color:var(--accent)}
.req.preempt{border-color:var(--preempt)}
.req.finish{opacity:.55}
.req.dim{opacity:.35}
@keyframes flash{0%,100%{background:var(--panel2)}50%{background:rgba(79,143,247,.22)}}
.req .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:8px}
.req .rid{font-weight:700}
.st{font-size:10.5px;padding:2px 8px;border-radius:8px;white-space:nowrap}
.st-RUNNING{background:rgba(53,208,127,.15);color:var(--ok)}
.st-WAITING{background:rgba(132,148,176,.2);color:var(--txt)}
.st-PREEMPTED{background:rgba(255,95,95,.15);color:var(--preempt)}
.st-WAITING_FOR_REMOTE_KVS,.st-WAITING_FOR_STREAMING_REQ,.st-WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR{background:rgba(255,197,61,.15);color:var(--warn)}
.bar{display:block;background:#0a0e16;border-radius:4px;height:15px;position:relative;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bar .vals{position:absolute;inset:0;font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px rgba(0,0,0,.8);font-variant-numeric:tabular-nums}
.req .meta{font-size:10.5px;color:var(--muted);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;overflow-wrap:anywhere}
.req .meta .ph{color:var(--gpu)}
.req .meta .chunk{color:var(--warn)}

/* block pool */
.pool{display:flex;flex-wrap:wrap;gap:4px}
.blk{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;border:1px solid var(--line);color:#fff;position:relative}
.blk.free{background:#0a0e16;color:var(--muted)}
.blk.cached{outline:2px solid var(--warn);outline-offset:-1px}
.blk.null{background:repeating-linear-gradient(45deg,#3a1220,#3a1220 3px,#2a0c16 3px,#2a0c16 6px);border-color:#6b2a3a;color:var(--null);font-weight:700}
.blk.new{animation:ring 1s ease 2}
.blk.sel{outline:2px solid #fff;outline-offset:1px;z-index:1}
.blk.dim{opacity:.3}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(79,143,247,0)}50%{box-shadow:0 0 0 3px rgba(79,143,247,.6)}}
.blk .tip{display:none;position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line2);padding:4px 8px;border-radius:6px;font-size:10px;white-space:nowrap;z-index:20}
.blk:hover .tip{display:block}
.poolhint{font-size:10.5px;color:var(--faint);margin-top:6px}

/* gpu: block table / slot mapping */
.btrow,.smrow{display:flex;gap:6px;align-items:center;font-size:11.5px;margin-bottom:3px;flex-wrap:wrap}
.btrow .rid,.smrow .rid{width:26px;font-weight:700;flex-shrink:0}
.btrow.sel,.smrow.sel{background:rgba(79,143,247,.12);border-radius:6px;padding:1px 4px}
.smrow .slots{display:flex;gap:3px;flex-wrap:wrap;min-width:0}
.slotchip{font-size:9.5px;padding:1px 5px;border-radius:6px;background:var(--panel3);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.ibline{font-size:11px;color:var(--muted);margin-top:2px}
.ibline b{color:var(--txt)}

/* KV cache grid */
.kvhead-row{display:flex;align-items:center;gap:10px;margin:2px 0 8px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}
.kvgrid{display:flex;flex-wrap:wrap;gap:8px}
.kvblock{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#0a0e16;content-visibility:auto;contain-intrinsic-size:300px 40px;max-width:100%}
.kvblock.sel-block{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2)}
.kvbhead{font-size:9px;color:var(--muted);text-align:center;padding:2px 0;border-bottom:1px solid var(--line);background:#0d1220}
.kvbhead b{color:var(--txt)}
.kvblock.null{border-color:#6b2a3a;background:#1a0810}
.kvblock.null .kvbhead{color:var(--null);background:#230813}
.cells{display:flex;overflow-x:auto;max-width:100%}
.kvblock .cell{width:var(--cell,26px);height:var(--cell,26px);flex-shrink:0;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;font-size:10px;color:#fff;background:#121a2b;overflow:hidden;line-height:1}
.kvblock .cell:last-child{border-right:none}
.kvblock .cell.empty{background:#0a0e16;color:transparent}
.kvblock .cell.null{background:repeating-linear-gradient(45deg,#2a0c16,#2a0c16 3px,#330f1c 3px,#330f1c 6px);border-color:#4a1a28}
.kvblock .cell.nsel{opacity:.18}
.kvblock .cell.sel{outline:2px solid #fff;outline-offset:-2px;z-index:1}
.celltok{font-weight:700;line-height:1;padding:1px 3px;border-radius:3px;display:inline-block;transform-origin:center}
.cell.new .celltok{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.3);opacity:.2}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.cellrid{position:absolute;top:1px;left:2px;font-size:7px;line-height:1;opacity:.95}
.cellslot{position:absolute;right:1px;bottom:1px;font-size:6px;color:rgba(255,255,255,.35);font-style:normal;font-variant-numeric:tabular-nums}
.kvfoot{font-size:10.5px;color:var(--faint);margin-top:8px;line-height:1.6}
.kvfoot b{color:var(--muted)}

/* special views */
.special{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gpu);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.special h3{font-size:13px;margin-bottom:8px}
.special .legend{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}
.dp .row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;flex-wrap:wrap}
.dp .row code{background:var(--panel3);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
.flag{padding:2px 8px;border-radius:8px;font-weight:600;font-size:11px}
.flag.on{background:rgba(53,208,127,.15);color:var(--ok)}
.flag.off{background:rgba(132,148,176,.2);color:var(--muted)}
.pdcontainer{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;margin-bottom:8px}
.pdnode{border:1px solid var(--line);border-radius:10px;padding:10px;flex:1;min-width:230px;background:var(--panel2)}
.pdn-prod{border-top:3px solid var(--cpu)}
.pdn-cons{border-top:3px solid var(--gpu)}
.pdtitle{font-size:12px;font-weight:600;margin-bottom:8px}
.pdtitle small{color:var(--muted);font-weight:400}
.pdarrow{display:flex;align-items:center;color:var(--faint);font-size:22px;font-weight:700}
.pdarrow.transfer{color:var(--warn)}
.pdreq{background:#0a0e16;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px}
.pdhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:12px}
.pdmeta{font-size:11px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.pdmeta .chunk{color:var(--warn);font-size:10px;border:1px solid var(--warn);border-radius:6px;padding:0 4px;margin-left:4px}
.pdtransfer{background:rgba(255,197,61,.12);border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:8px}
.note{font-size:12px;color:var(--muted);padding:8px 0}

/* ---------- legend ---------- */
.legendbar{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:10px}
.legendbar .lg{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.legendbar .lgs{display:flex;gap:5px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid var(--line)}
.sw.req{width:12px;height:12px;border-radius:50%}

/* Disable native scroll anchoring inside re-rendered regions so the JS
   section-anchor restore below is the only thing that moves the viewport. */
#main{overflow-anchor:none}

@media (max-width:960px){.worlds{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ================= lecture page design =================
   Structure: sticky top-bar + left outline sidebar + main content.
   Reading flow: 导航大纲 → 本节学习目标 → 图文讲解 → 底部翻页。 */

/* ---- layout shell ---- */
:root{--tb-offset:64px}   /* 顶栏高度基准：outline 的 sticky top 与之对齐 */
.kv-shell{display:flex;gap:18px;align-items:flex-start;margin-top:14px}
.kv-main{flex:1;min-width:0}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 4px;margin:-18px -18px 0;padding-left:18px;padding-right:18px;flex-wrap:wrap}
.topbar .brand{display:flex;flex-direction:column;min-width:0}
.topbar h1{font-size:16.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:10.5px;color:var(--faint);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;margin-left:auto}
.topbar .crumb b{color:var(--txt);font-weight:600}
.topbar .crumb .tick{color:var(--faint)}
.menu-btn{display:none;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:13px}

/* ---- outline sidebar ---- */
.outline{width:264px;flex-shrink:0;position:sticky;top:var(--tb-offset);max-height:calc(100vh - 80px);overflow-y:auto;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);display:flex;flex-direction:column}
.outline .ol-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--faint);letter-spacing:.05em;font-weight:600}
.outline .ol-head .olsteps{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.oltree{padding:6px;display:flex;flex-direction:column;gap:2px}
.olch{border-radius:8px}
.olch-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:12.5px;border:none;background:none}
.olch-row:hover{background:var(--panel2);color:var(--txt)}
.olch.open .olch-row{color:var(--txt);font-weight:600}
.olch-row .cdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.olch-row .ctitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.olch-row .ccaret{margin-left:auto;color:var(--faint);font-size:10px;transition:transform .15s ease}
.olch.open .olch-row .ccaret{transform:rotate(90deg)}
.olsecs{margin:0 0 4px 22px;padding-left:8px;border-left:1px solid var(--line2);display:none;flex-direction:column;gap:1px}
.olch.open .olsecs{display:flex}
.olsec{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:5px 8px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:11.5px;border:none;background:none;line-height:1.35}
.olsec:hover{background:var(--panel2);color:var(--txt)}
.olsec .num{color:var(--faint);font-variant-numeric:tabular-nums;font-size:10.5px;min-width:16px}
.olsec.active{background:rgba(79,143,247,.14);color:var(--txt);font-weight:600}
.olsec.active .num{color:var(--accent2)}
.olsec.done .num{color:var(--ok)}
.olsec.done::after{content:"✓";color:var(--ok);margin-left:auto;font-size:10px}
.olsec .stitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- story (teaching card) ---- */
/* 类名加 l- 前缀：避开注入的 scheduler 主题同名类（.story），不再靠覆盖顺序兜底 */
.lstory{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.lstory .shead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.lstory .shead .ch{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:12px;color:#fff;letter-spacing:.04em;white-space:nowrap}
.lstory .shead h2{font-size:16.5px;flex:1;min-width:0;line-height:1.3}
.lstory .goal{display:flex;gap:10px;padding:10px 16px;background:rgba(79,143,247,.06);border-top:1px solid rgba(79,143,247,.15)}
.lstory .goal .glabel{flex-shrink:0;font-size:10.5px;font-weight:700;color:var(--accent2);padding-top:2px;letter-spacing:.05em}
.lstory .goal .gtext{font-size:12.5px;color:#c3cee0;line-height:1.6}
.lstory .goal b{color:var(--txt)}
.lstory .goal code{background:var(--panel3);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}

/* ---- body blocks ---- */
.body{display:flex;flex-direction:column;gap:14px}
/* 内容卡：类名 l- 前缀，避开 scheduler 主题的 .blk（24x24 KV 方块） */
.lblk{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.lblk code,.lstory code{background:var(--panel3);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
.lblk p{color:#c3cee0;font-size:13px;line-height:1.75;margin:0}
.lblk p + p{margin-top:10px}
.lblk b{color:var(--txt)}
/* 正文小节标题统一用 h3（story 是 h2，不再跳级）；h3 可能出现在 .lblk / .mcfg 内 */
.kv-main h3{font-size:12px;color:var(--accent2);margin:14px 0 8px;font-weight:600;letter-spacing:.02em}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.tbl th{background:var(--panel2);color:var(--txt);font-weight:600}
.tbl td{color:#c3cee0}
.tbl td b{color:var(--txt)}
.coderef{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.coderef .f{font-family:ui-monospace,monospace;color:var(--accent2)}
.coderef .ln{font-family:ui-monospace,monospace;color:var(--warn)}
.coderef .lab{color:var(--txt)}
.coderef .src{font-size:10px;color:var(--faint);margin-left:auto}
.callout{border:1px solid rgba(255,197,61,.4);border-left:4px solid var(--warn);background:rgba(255,197,61,.07);border-radius:var(--radius);padding:11px 15px;font-size:12.5px;color:#d8c9a0;line-height:1.65}
.callout b{color:#ffe1a0}

/* ---- model config card ---- */
.mcfg{display:flex;flex-direction:column;gap:12px}
.mcfg .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mcfg .name{font-weight:700;font-size:15px;color:var(--txt)}
.mtag{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:700;border:1px solid;white-space:nowrap}
.mtag.nbf{background:rgba(79,143,247,.15);color:var(--cpu);border-color:var(--cpu)}
.mtag.packed{background:rgba(255,197,61,.15);color:var(--warn);border-color:var(--warn)}
.mtag.uniform{background:rgba(176,124,247,.15);color:var(--gpu);border-color:var(--gpu)}
.mtag.big{background:rgba(53,208,127,.15);color:var(--ok);border-color:var(--ok)}
.mcfg .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.kpi .v{font-size:17px;font-weight:700;color:var(--accent2);font-variant-numeric:tabular-nums}
.kpi .l{font-size:10.5px;color:var(--faint);margin-top:2px}
.grow{display:flex;flex-direction:column;gap:7px}
.gcard{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--panel2)}
.gcard .ghead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.gcard .gkind{font-size:10.5px;font-weight:700;color:var(--cpu)}
.gcard .gmeta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.glayer{display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:6px;background:var(--panel3);border:1px solid var(--line);margin:1px;color:#c3cee0}
.tplan{display:flex;flex-direction:column;gap:4px}
.trow{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.trow b{color:var(--txt)}
.slab{position:relative;border:1px solid var(--line2);border-radius:6px;overflow:hidden;margin-top:6px}
.slab .seg{position:absolute;top:0;bottom:0;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(79,143,247,.34),rgba(79,143,247,.2))}
.slab .seg:nth-child(even){background:linear-gradient(180deg,rgba(176,124,247,.34),rgba(176,124,247,.2))}
.slab .seg:nth-child(3n){background:linear-gradient(180deg,rgba(53,208,127,.3),rgba(53,208,127,.16))}

/* ---- diagrams ---- */
.dia{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;overflow-x:auto}
.dia .cap{font-size:11px;color:var(--faint);margin-top:9px;line-height:1.6}
.dimrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.dim{font-family:ui-monospace,monospace;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel3);color:#c3cee0}
.dim b{color:var(--accent2)}
.arrow{color:var(--faint);font-size:16px}
.chaintable{display:flex;flex-direction:column;gap:5px;font-size:11.5px}
.chainrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:ui-monospace,monospace}
.chainrow .k{width:64px;color:var(--faint)}
.chainrow .v{color:var(--txt)}
.chainrow .v.hl{color:var(--warn);font-weight:700}
.conv{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:11.5px}
.conv_var{display:inline-block;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel3);font-family:ui-monospace,monospace;font-size:11px;color:var(--accent2)}
.gbar{display:block;background:#0a0e16;border-radius:4px;height:14px;position:relative;overflow:hidden;font-size:9.5px}
.gbar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--cpu),var(--accent2))}
.winrow{display:flex;gap:2px;align-items:center;font-size:10px;flex-wrap:wrap}
.wtok{width:28px;height:28px;border-radius:5px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px}
.wtok.out{background:linear-gradient(135deg,#3a1220,#2a0c16);border-color:#6b2a3a;color:var(--null)}
.wtok.in{background:var(--panel3);color:#c3cee0}
.wtok.cur{background:linear-gradient(135deg,var(--ok),#1f8f5a);color:#fff}

/* ---- model comparison table ---- */
.cmpbox{overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}
.cmp th,.cmp td{border:1px solid var(--line);padding:9px 11px;vertical-align:top;text-align:left}
.cmp thead th{background:var(--panel2);color:var(--txt);font-weight:600;font-size:11.5px;white-space:nowrap;position:sticky;top:0}
.cmp td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--accent2);font-weight:600}
.cmp .c-model .c-name{font-weight:700;color:var(--txt);font-size:12.5px}
.cmp .c-model .c-groups{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.cmp .gtag{font-size:9.5px;padding:1px 6px;border-radius:6px;background:var(--panel3);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.cmp .c-note{color:#aab6cc;font-size:11.5px;line-height:1.6;min-width:220px}
.cmp .c-note b{color:var(--txt)}
.cmp .c-bar .mbar{width:120px;height:10px;background:#0a0e16;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.cmp .c-bar .mbar .fill{height:100%;background:linear-gradient(90deg,var(--cpu),var(--warn))}
.cmp .c-bar .mval{font-size:10.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp tr:hover td{background:rgba(79,143,247,.04)}

/* ---- mapping demo ---- */
.mmap .mctrl{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mmap .mctrl button{padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:12px}
.mmap .mctrl button:hover{background:var(--panel3)}
.mmap .mctrl button:disabled{opacity:.4;cursor:default}
.mmap .mstep{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mmap .mstep b{color:var(--txt)}
.mchain{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.mchain .creq{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2)}
.mchain .creq .chead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.mchain .creq .chead b{color:var(--txt)}
.mchain .ctoks{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.mchain .ctok{width:24px;height:24px;border-radius:5px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);background:var(--panel3);font-variant-numeric:tabular-nums}
.mchain .ctok.new{background:rgba(255,197,61,.18);border-color:var(--warn);color:#ffe1a0;font-weight:700}
.mchain .ctok.cur{background:var(--ok);color:#fff;font-weight:700}
.mchain .cpath{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.mchain .pn{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel3);font-family:ui-monospace,monospace;color:#c3cee0}
.mchain .pn b{color:var(--txt)}
.mchain .pn.slot{background:rgba(255,197,61,.14);border-color:var(--warn)}
.mchain .pn.slot b{color:var(--warn)}
.mchain .pconn{color:var(--faint);font-size:12px}
.slottab{width:100%;border-collapse:collapse;font-size:11.5px}
.slottab th,.slottab td{border:1px solid var(--line);padding:5px 8px;text-align:center;font-family:ui-monospace,monospace}
.slottab th{background:var(--panel2);color:var(--muted);font-size:10.5px}
.slottab td.slot{color:var(--warn);font-weight:700}
.slottab td.hl{background:rgba(255,197,61,.12);font-weight:700}
/* mapping demo: 物理 slot 网格（每格 = 一个物理 slot，格内 pos、下方 slot 号） */
.mkgrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mkblk{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#0a0e16}
.mkbhead{font-size:9.5px;color:var(--muted);text-align:center;padding:2px 6px;border-bottom:1px solid var(--line);background:#0d1220;white-space:nowrap}
.mkbhead b{color:var(--txt)}
.mkbody{display:flex}
.mkslot{width:30px;height:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-right:1px solid var(--line);font-size:8.5px;line-height:1.1;background:#121a2b}
.mkslot:last-child{border-right:none}
.mkslot i{font-style:normal;font-weight:700;color:#fff}
.mkslot b{font-weight:400;color:rgba(255,255,255,.35);font-variant-numeric:tabular-nums}
.mkslot.empty{background:#0a0e16}
.mkslot.empty i{color:transparent}
.mkslot.empty b{color:rgba(255,255,255,.22)}
.mkslot.new{background:rgba(255,197,61,.16)}
.mkslot.new i{color:#ffe1a0}
.mkslot.cur{background:rgba(53,208,127,.22);outline:2px solid var(--ok);outline-offset:-2px}
.mkslot.cur i{color:#7dffc4}
.mgridlab{font-size:10px;color:var(--faint);margin-top:10px}

/* ---- pager ---- */
.pager{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.pager .pbtn{flex:1;min-width:150px;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted);transition:border-color .15s ease,background .15s ease}
.pager .pbtn:hover{background:var(--panel2);border-color:var(--accent)}
.pager .pbtn:disabled{opacity:.35;cursor:default}
.pager .pbtn .dir{font-size:10px;color:var(--faint);letter-spacing:.06em}
.pager .pbtn .pt{font-size:12.5px;color:var(--txt);font-weight:600;margin-top:2px;line-height:1.3}
.pager .pbtn[data-side="next"]{text-align:right}
.pager .psep{color:var(--faint);font-size:11px;white-space:nowrap}

/* ---- responsive ---- */
@media (min-width:921px){.topbar{flex-wrap:nowrap}}   /* 桌面端顶栏不换行，outline 的 sticky top 才稳定 */
@media (max-width:920px){
  .outline{position:fixed;left:0;top:0;bottom:0;z-index:70;width:280px;max-height:none;border-radius:0;transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .outline.open{transform:translateX(0)}
  .menu-btn{display:inline-flex}
  .kv-shell{display:block}
  .topbar .brand .sub{display:none}
}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr 1fr}
  .cmp td.c-note{min-width:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
const PAGE = {"chapters": [{"id": "logical", "title": "逻辑寻址", "color": "#4f8ff7", "sections": [{"title": "为什么 KV cache 要分块", "body": [{"t": "p", "md": "decode 每生成一个 token，注意力都要读它**之前所有 token** 的 K/V。若不缓存，每步得把整段历史重新算一遍，代价随序列长度 **O(n²) 增长**。"}, {"t": "p", "md": "KV cache 就是把这些 K/V 存进显存，用**固定的块（block/page）**管理。每个块固定装 **block_size 个 token** 的 KV，块是分配、释放、缓存的最小单元。"}, {"t": "p", "md": "分块（PagedAttention）相比 Transformers 的整段连续缓存："}, {"t": "table", "head": ["连续缓存", "vLLM 分块缓存"], "rows": [["一个序列预留连续整段，长度不定导致碎片", "块可散落，用 block table 记录每请求的块"], ["按最大序列长度预留 → 显存浪费", "按实际 token 用量动态分配/回收"], ["并发序列互相挤占", "块池共享，空闲块按需分配"]]}, {"t": "code", "file": "vllm/v1/worker/gpu/block_table.py", "line": 107, "label": "BlockTable：每请求的 block_id 表"}], "goal": "理解不缓存历史的代价（O(n²)），以及分块（PagedAttention）如何用固定大小的块管理 K/V、省显存、抗碎片。"}, {"title": "两个块层级：manager block 与 kernel block", "body": [{"t": "p", "md": "vLLM 里有两层块，千万别混："}, {"t": "table", "head": ["层级", "大小", "谁在用", "作用"], "rows": [["manager block", "`block_size`（如 4/16/64）", "scheduler / KVCacheManager", "逻辑分配、前缀缓存、引用计数"], ["kernel block", "`kernel_block_size`（如 16/64）", "attention 内核", "内核按固定粒度访问显存"]]}, {"t": "p", "md": "worker 把 manager block **展开**成若干 kernel block：设 `bpk = block_size // kernel_block_size`，manager 块 `b` 变成 `b*bpk + 0 … b*bpk + bpk-1` 共 `bpk` 个 kernel 块。"}, {"t": "code", "file": "vllm/v1/worker/gpu/block_table.py", "line": 118, "label": "append_block_ids：b -> b*bpk + k"}], "goal": "分清 manager block 与 kernel block 两层，掌握 bpk 展开（b → b·bpk+k）。"}, {"title": "真实映射：pos → block → slot", "body": [{"t": "p", "md": "下面用真实 Scheduler 分配 2 个短请求，再按 worker 逻辑把每个 token 位置展开成 manager 块 → kernel 块 → 物理 slot。可切换调度步查看。"}, {"t": "mapping"}], "goal": "在真实 Scheduler 分配上，把一个 token 位置展开成 manager 块 → kernel 块 → 物理 slot。"}]}, {"id": "physical", "title": "物理布局", "color": "#b07cf7", "sections": [{"title": "原始分配与 KVCacheTensor", "body": [{"t": "p", "md": "物理上，KV cache 是一段段 **int8 原始字节**。`KVCacheConfig.kv_cache_tensors` 描述如何初始化：`size`（字节）、`shared_by`（共享该张量的层名）、`offset`（打包时层在该块 slab 内的字节偏移）、`block_stride`（打包时块步长）。"}, {"t": "code", "file": "vllm/v1/kv_cache_interface.py", "line": 1007, "label": "KVCacheTensor"}, {"t": "p", "md": "worker 先 `torch.zeros` 分配原始张量，再按各层 spec `reshape` 成注意力内核要的形状。"}, {"t": "code", "file": "vllm/v1/worker/gpu/attn_utils.py", "line": 199, "label": "_allocate_kv_cache"}], "goal": "认识到 KV cache 的物理本质是一段段 int8 原始字节，由 KVCacheTensor 描述 size / shared_by / offset / block_stride。"}, {"title": "num-blocks-first 与 L·B·H·N·C 维度顺序", "body": [{"t": "p", "md": "最常见的物理排布是 **num-blocks-first**：块是张量的第 0 维。注意力内核的 `get_kv_cache_shape` 给出**逻辑形状**，`get_kv_cache_stride_order` 给出到物理内存的排列。"}, {"t": "dia", "kind": "stride_order", "data": {}}, {"t": "p", "md": "对 FlashAttention，逻辑形状是 `(B, H, N, 2D)` —— K 与 V 沿最后一维拼接 （`2*head_size`），`N = block_size`。真正的物理顺序由 `get_kv_cache_stride_order` 决定："}, {"t": "dia", "kind": "stride_variants", "data": {}}, {"t": "code", "file": "vllm/v1/attention/backends/flash_attn.py", "line": 196, "label": "get_kv_cache_stride_order"}], "goal": "能区分逻辑形状 (B,H,N,2D) 与物理排列 stride_order，理解「num-blocks-first = B 在最外层」。"}, {"title": "多组共享池（general case）", "body": [{"t": "p", "md": "当模型有**多个 kv_cache_group**（如 Mamba + 注意力），且各层页大小可统一时，物理上按 `group_size` 个池分配，**每个池被每个组的一层按同一层下标共享**。"}, {"t": "dia", "kind": "shared_pool", "data": {}}, {"t": "p", "md": "例如 3 组 `(full.0, full.1)`、`(sw.0, sw.2)`、`(sw.1, padding)`：`full.0 / sw.0 / sw.1` 共享一个 Tensor，`full.1 / sw.2` 共享另一个。"}, {"t": "code", "file": "vllm/v1/core/kv_cache_utils.py", "line": 1327, "label": "get_kv_cache_config_from_groups"}], "goal": "理解多个 kv_cache_group 如何按 layer 下标共享同一批物理池。"}, {"title": "packed 打包布局（DeepSeek-V4）", "body": [{"t": "p", "md": "当各层页大小不同又无法统一（如 DeepSeek-V4 的 MLA 与 SWA-MLA），vLLM 改用 **packed 打包布局**：所有组叠进**同一块 slab**，每层在块内拥有一个字节 `offset`，块内总步长记在 `block_stride`。"}, {"t": "dia", "kind": "packed", "data": {}}, {"t": "code", "file": "vllm/v1/core/kv_cache_utils.py", "line": 1249, "label": "_get_packed_kv_cache_layout"}], "goal": "理解页大小不统一时的 packed 打包：单 slab、逐层 offset、block_stride。"}, {"title": "页填充与量化缩放", "body": [{"t": "p", "md": "某些布局要求页对齐：`page_size_padded` 会在每页后补字节，worker 用 `torch.as_strided` 跳过填充（num-blocks-first 才支持）。"}, {"t": "code", "file": "vllm/v1/worker/gpu/attn_utils.py", "line": 294, "label": "page_size_padded -> as_strided"}, {"t": "p", "md": "量化 KV（如 fp8 per-token-head、int4）时，每 token 的缩放因子也**从原始 KV 分配里切出**独立张量，需在 `page_size_bytes` 里计入。"}, {"t": "code", "file": "vllm/v1/kv_cache_interface.py", "line": 217, "label": "unpadded_page_size_bytes 计入 per-token scales"}], "goal": "了解页对齐（page_size_padded + as_strided）与量化每 token 缩放字节的计入。"}]}, {"id": "models", "title": "模型差异", "color": "#35d07f", "sections": [{"title": "GQA Full Attention（Llama-7B）", "body": [{"t": "p", "md": "GQA：`num_kv_heads < num_query_heads`，多个 query head 共享一组 K/V。每 token 存 K/V 各 `num_kv_heads` 个 head，`head_size=128`，fp16。"}, {"t": "kvcfg", "model": "llama"}, {"t": "p", "md": "**关键数字**：每 token 单层 = 8 heads × 128 × 2 字节 × (K+V) = **4096 B**；16 token/块 → 每块 64 KiB。全模型 ×32 层。"}], "goal": "看懂 GQA 每 token 字节的来源：num_kv_heads × head_size × 2(K+V) × 2B。"}, {"title": "Sliding Window（Mistral-7B）", "body": [{"t": "p", "md": "滑窗注意力只保留最近 `sliding_window` 个 token。窗口外历史块的 KV 不再需要 → 替换为 null 块并释放，每请求 KV 上界 O(window) 而非 O(seq_len)。"}, {"t": "kvcfg", "model": "mistral"}, {"t": "dia", "kind": "swa", "data": {}}], "goal": "理解滑窗为何让每请求 KV 有上界 O(window)，窗口外块被替换为 null 并释放。"}, {"title": "MLA（DeepSeek-V3/R1）", "body": [{"t": "p", "md": "MLA 把每层的 K/V 压缩进低秩潜在 `kv_lora`（=512），再叠加 RoPE 的 `k_rope`（=64），故 `head_size = 576`，`num_kv_heads = 1`。"}, {"t": "kvcfg", "model": "deepseek_v3"}, {"t": "p", "md": "fp8_ds_mla 自定义排布：每 token / 每层只占 **656 B**（对比 GQA 的 4096 B × 多 head），大幅省显存。压缩的是**缓存内容**，不是块结构。"}, {"t": "dia", "kind": "mla", "data": {}}], "goal": "理解 MLA 压缩潜在 + k_rope 如何把每 token 缓存压到数百字节。"}, {"title": "DeepSeek Sparse Attention（DSA）", "body": [{"t": "p", "md": "DSA 在滑窗基础上，用 **indexer** 为每个 query 选出 top-k 个全局 token 参与注意力。**稀疏只改变『注意哪些 token』，KV cache 布局与 MLA 完全相同** —— 仍是压缩潜在 + k_rope，num_kv_heads=1。"}, {"t": "kvcfg", "model": "dsa"}, {"t": "p", "md": "所以在排布层面，DSA ≈ MLA；区别体现在注意力后端（`DeepseekSparseSWABackend`）与稀疏索引，而非缓存张量。"}, {"t": "code", "file": "vllm/v1/attention/backends/mla/sparse_swa.py", "line": 112, "label": "DeepseekSparseSWABackend"}], "goal": "明白稀疏只改变『注意哪些 token』，KV cache 布局与 MLA 完全相同。"}, {"title": "Hybrid：Mamba + Full Attention（Jamba）", "body": [{"t": "p", "md": "Mamba 层不存 token 化的 K/V，而是每块存一段**状态**（conv + ssm），物理上以 `[num_blocks, 1, 1, page_size_bytes]` 的页视图存放。"}, {"t": "kvcfg", "model": "jamba"}, {"t": "p", "md": "Mamba 与注意力形成**多个 kv_cache_group**，各自独立 block table，但共享同一 BlockPool。块大小可能在页统一时被拉大（下面 Mamba 组 bs=16、注意力组 bs=64）。"}, {"t": "dia", "kind": "mamba", "data": {}}], "goal": "看懂 Mamba 状态块与注意力块如何共存、分属多个 kv_cache_group。"}, {"title": "六模型排布对比", "body": [{"t": "p", "md": "全部由真实 `get_kv_cache_groups` + `get_kv_cache_config_from_groups` 计算（8 GiB KV 显存，block_size=16）。"}, {"t": "kvcfg_compare", "models": ["llama", "mistral", "deepseek_v3", "dsa", "jamba", "deepseek_v4"]}], "goal": "一眼对比六种模型的布局类型、每 token 字节与并发容量差异。"}]}, {"id": "hybrid", "title": "Hybrid 多组", "color": "#ffc53d", "sections": [{"title": "kv_cache_group 与块大小统一", "body": [{"t": "p", "md": "具同一 KV cache 规格的层归为一组（`KVCacheGroupSpec`）。每组的 `block_size` 可能不同。上层用两个额外粒度协调："}, {"t": "table", "head": ["粒度", "取值", "作用"], "rows": [["scheduler_block_size", "各 group block_size 的 **LCM**", "调度器 token 对齐"], ["hash_block_size", "各 group block_size 的 **GCD**", "前缀缓存最低匹配粒度"]]}, {"t": "code", "file": "vllm/v1/core/kv_cache_utils.py", "line": 607, "label": "resolve_kv_cache_block_sizes"}], "goal": "掌握 scheduler_block_size(LCM) 与 hash_block_size(GCD) 两个对齐粒度。"}, {"title": "一组 BlockPool，多组 BlockTable", "body": [{"t": "p", "md": "所有 group 共享同一个 `BlockPool`（同一批 KVCacheBlock、同一空闲队列），但**每个 group 各自维护 `req_to_blocks`（block table）**。调度器按 LCM 粒度对齐后，把每个 group 的块分别写入各自的表。"}, {"t": "dia", "kind": "hybrid_groups", "data": {}}, {"t": "code", "file": "vllm/v1/core/kv_cache_coordinator.py", "line": 63, "label": "KVCacheCoordinator 协调多组"}], "goal": "理解所有组共享同一 BlockPool、但各自维护独立 block table。"}, {"title": "DeepSeek-V4 的 UniformType 打包", "body": [{"t": "p", "md": "DeepSeek-V4 的 MLA 与不同窗口的 SWA-MLA 页大小不同 → 按 `(block_size, sliding_window)` 分组为多个 `UniformTypeKVCacheSpecs`，再走 packed 布局：组各自在 slab 里排布，层按字节偏移。"}, {"t": "kvcfg", "model": "deepseek_v4"}, {"t": "dia", "kind": "packed", "data": {}}, {"t": "code", "file": "vllm/v1/core/kv_cache_utils.py", "line": 1545, "label": "group_and_unify_kv_cache_specs"}], "goal": "理解 UniformTypeKVCacheSpecs 分组 + packed 打包的组合。"}]}, {"id": "mapping", "title": "逻辑→物理链路", "color": "#ff6b6b", "sections": [{"title": "完整链路", "body": [{"t": "p", "md": "把前面几章串起来，一个逻辑 token 位置映射到物理缓存地址的完整链路："}, {"t": "dia", "kind": "slot_chain", "data": {}}, {"t": "p", "md": "公式：`pos // block_size` = manager 块索引 → 查 BlockPool 得 manager `block_id`；`block_id * bpk + (pos % block_size) // kernel_block_size` = kernel 块；`slot = kernel_block_id * kernel_block_size + (pos % kernel_block_size)`。内核再以 `base + layer_offset + slot * stride` 定位。"}, {"t": "code", "file": "vllm/v1/worker/gpu/block_table.py", "line": 262, "label": "_compute_slot_mappings_kernel"}], "goal": "把 pos → manager 块 → kernel 块 → slot → 地址 串成一条完整链路。"}, {"title": "跨层 KV sharing 与量化缩放", "body": [{"t": "p", "md": "层可以 **别名** 到目标层的 KV 张量（`kv_sharing_target_layer_name`），多个 Attention 模块共享同一份缓存，不重复分配。"}, {"t": "code", "file": "vllm/v1/worker/gpu/attn_utils.py", "line": 460, "label": "共享层 -> 目标层张量"}, {"t": "p", "md": "量化每 token/每 head 的缩放张量从原始 KV 分配中切出，由注意力后端托管，但字节在 `page_size_bytes` 中已预算。"}], "goal": "了解层别名共享（kv_sharing_target_layer_name）与量化缩放张量的切分。"}]}, {"id": "compare", "title": "实战对比", "color": "#22d3ee", "sections": [{"title": "显存预算 → 并发容量", "body": [{"t": "p", "md": "KV cache 的 `num_blocks` 近似 = `显存 ÷ 每块字节`，随显存预算**线性增长**；但不同模型因每 token 字节不同，爬升速率差很多。下面用真实规划代码（`get_kv_cache_groups` + `get_kv_cache_config_from_groups`）算出 3 种代表性模型（GQA / MLA / Mamba hybrid）在 2–16 GiB 显存下的块容量。"}, {"t": "memseries"}, {"t": "p", "md": "**读法 ion", "rep_per_token": 4096, "points": [{"mem_gib": 2, "num_blocks": 1024}, {"mem_gib": 4, "num_blocks": 2048}, {"mem_gib": 8, "num_blocks": 4096}, {"mem_gib": 16, "num_blocks": 8192}]}, "deepseek_v3": {"label": "DeepSeek-V3/R1 · MLA", "rep_per_token": 656, "points": [{"mem_gib": 2, "num_blocks": 3354}, {"mem_gib": 4, "num_blocks": 6708}, {"mem_gib": 8, "num_blocks": 13416}, {"mem_gib": 16, "num_blocks": 26832}]}, "jamba": {"label": "Jamba · Mamba + Full Attention hybrid", "rep_per_token": 16384, "points": [{"mem_gib": 2, "num_blocks": 1365}, {"mem_gib": 4, "num_blocks": 2730}, {"mem_gib": 8, "num_blocks": 5461}, {"mem_gib": 16, "num_blocks": 10922}]}}}}};
let curCh = 0, curSec = 0;
const visited = new Set();   // "ch/idx" of sections already opened
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function md(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>'); }
function fmtBytes(n){ if(n>=1e9) return (n/1e9).toFixed(1)+' GB'; if(n>=1e6) return (n/1e6).toFixed(1)+' MB'; if(n>=1e3) return (n/1e3).toFixed(1)+' KB'; return n+' B'; }

const activeChapter = () => PAGE.chapters[curCh];
const activeSection  = () => activeChapter().sections[curSec];
const totalSecs = () => PAGE.chapters.reduce((a,c)=>a+c.sections.length,0);

function currentHash(){ return activeChapter().id+'/'+curSec; }

/* ---------- renderers ---------- */
function renderTopbar(){
  const ch=activeChapter(), s=activeSection();
  document.getElementById('crumbCh').innerHTML = `<b style="color:${ch.color}">${esc(ch.title)}</b>`;
  document.getElementById('crumbSec').textContent = `第 ${curSec+1}/${ch.sections.length} 节`;
}
function renderOutline(){
  const t = document.getElementById('oltree');
  t.innerHTML = PAGE.chapters.map((c,ci)=>{
    const open = ci<=curCh;   // keep current chapter and earlier ones open
    const secs = c.sections.map((s,si)=>{
      const key = ci+'/'+si; const isCur = ci===curCh&&si===curSec; const isDone = visited.has(key);
      return `<button class="olsec ${isCur?'active':''} ${isDone?'done':''}"
        onclick="goSectionTo(${ci},${si})"${isCur?' aria-current="page"':''}
        title="${esc(s.title)}">
        <span class="num">${si+1}</span><span class="stitle">${esc(s.title)}</span></button>`;
    }).join('');
    return `<div class="olch ${open?'open':''}">
      <button class="olch-row" onclick="toggleCh(${ci})" aria-expanded="${open}">
        <span class="cdot" style="background:${c.color}"></span>
        <span class="ctitle">${esc(c.title)}</span>
        <span class="ccaret">›</span>
      </button>
      <div class="olsecs">${secs}</div>
    </div>`;
  }).join('');
  document.getElementById('olsteps').textContent = `${PAGE.chapters.length} 章 · ${totalSecs()} 节`;
}
function renderStory(){
  const ch=activeChapter(), s=activeSection();
  const goal = s.goal ? `<div class="goal"><span class="glabel">本节目标</span><span class="gtext">${md(s.goal)}</span></div>` : '';
  document.getElementById('story').innerHTML = `
    <div class="shead">
      <span class="ch" style="background:${ch.color}">${esc(ch.title)}</span>
      <h2>${esc(s.title)}</h2>
    </div>${goal}`;
}
function renderPager(){
  const ch=activeChapter(); const n=ch.sections.length;
  const prevSec = curSec>0 ? {c:curCh,i:curSec-1,t:ch.sections[curSec-1].title} : (curCh>0?{c:curCh-1,i:PAGE.chapters[curCh-1].sections.length-1,t:PAGE.chapters[curCh-1].sections[PAGE.chapters[curCh-1].sections.length-1].title}:null);
  const nextSec = curSec<n-1 ? {c:curCh,i:curSec+1,t:ch.sections[curSec+1].title} : (curCh<PAGE.chapters.length-1?{c:curCh+1,i:0,t:PAGE.chapters[curCh+1].sections[0].title}:null);
  document.getElementById('pager').innerHTML = `
    <button class="pbtn" data-side="prev" ${prevSec?'':'disabled'} onclick="goSectionTo(${prevSec?prevSec.c:-1},${prevSec?prevSec.i:0})">
      <div class="dir">‹ 上一节</div><div class="pt">${prevSec?esc(prevSec.t):'已到开头'}</div></button>
    <span class="psep">进度 ${curSec+1}/${n}</span>
    <button class="pbtn" data-side="next" ${nextSec?'':'disabled'} onclick="goSectionTo(${nextSec?nextSec.c:-1},${nextSec?nextSec.i:0})">
      <div class="dir">下一节 ›</div><div class="pt">${nextSec?esc(nextSec.t):'已是最后'}</div></button>`;
}
function renderBody(){ document.getElementById('body').innerHTML = activeSection().body.map(renderBlock).join(''); }
function render(){ renderTopbar(); renderOutline(); renderStory(); renderBody(); renderPager(); pruneMM(); }

/* ---------- navigation ---------- */
function goSectionTo(ci,si){
  if(ci<0||ci>=PAGE.chapters.length) return;
  const n=PAGE.chapters[ci].sections.length;
  if(si<0||si>=n) return;
  curCh=ci; curSec=si; visited.add(ci+'/'+si);
  render(); syncHash(); closeOutline();
  const story=document.getElementById('story'); if(story) story.scrollIntoView({block:'start',behavior:reduced?'auto':'smooth'});
}
function goChapter(i){ if(i>=0&&i<PAGE.chapters.length){ curCh=i; curSec=0; visited.add(i+'/0'); render(); syncHash(); } }
function toggleCh(ci){
  const el=document.querySelectorAll('.olch')[ci]; el.classList.toggle('open');
  const btn=el.querySelector('.olch-row'); btn.setAttribute('aria-expanded', el.classList.contains('open'));
}
function syncHash(){
  const h = '#'+currentHash();
  if(location.hash === h) return;                     // 避免重复入栈
  try{ history.pushState(null,'',h); }catch(e){}      // pushState：后退/前进可回到上一节
}
function parseHash(){
  const h=location.hash.replace(/^#/,''); if(!h) return;
  const [cid,si]=h.split('/');
  const ci=PAGE.chapters.findIndex(c=>c.id===cid);
  if(ci>=0){ curCh=ci; curSec=(si!=null)?(+si||0):0; visited.add(ci+'/'+curSec); }
}
function closeOutline(){
  const o=document.getElementById('outline'); o.classList.remove('open');
  const b=document.getElementById('menuBtn');
  b.setAttribute('aria-expanded','false'); b.setAttribute('aria-label','打开目录');
}
function openMenu(){
  const o=document.getElementById('outline'); o.classList.add('open');
  const b=document.getElementById('menuBtn');
  b.setAttribute('aria-expanded','true'); b.setAttribute('aria-label','关闭目录');
}

/* ---------- block renderers ---------- */
function renderBlock(b){
  switch(b.t){
    case 'p': return `<div class="lblk"><p>${md(b.md)}</p></div>`;
    case 'callout': return `<div class="callout">${md(b.md)}</div>`;
    case 'code': return `<div class="lblk"><span class="coderef">
        <span class="f">${esc(b.file)}</span><span class="ln">:${b.line}</span>
        ${b.label?`<span class="lab">· ${esc(b.label)}</span>`:''}<span class="src">源码参考</span></span></div>`;
    case 'table': return `<div class="lblk"><table class="tbl">
        <thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${md(String(c))}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>`;
    case 'kvcfg': return renderKvcfg(PAGE.data.models[b.model]);
    case 'kvcfg_compare': return renderCompare(b.models);
    case 'memseries': return renderMemSeries();
    case 'mapping': return renderMapping(PAGE.data.mapping);
    case 'dia': return renderDia(b.kind, b.data, curSec);
    default: return '';
  }
}

function renderKvcfg(m, compact=false){
  const tagCls = m.layout==='packed'?'packed':(m.layout==='uniform_type'?'uniform':'nbf');
  const tagTxt = m.layout==='packed'?'PACKED':(m.layout==='uniform_type'?'UNIFORM-TYPE':'NUM-BLOCKS-FIRST');
  const maxTok = Math.max.apply(null, m.groups.map(g=>g.per_token_bytes));
  const groupsHtml = m.groups.map(g=>{
    const widthPct = Math.round(g.per_token_bytes/maxTok*100);
    return `<div class="gcard">
      <div class="ghead"><span class="gkind">${esc(g.kind)}</span>
        <span class="gmeta">${g.num_layers} 层 · block_size=${g.block_size} · 每 token ${g.per_token_bytes} B · 每块 ${fmtBytes(g.page_size_bytes)}</span></div>
      <div class="gbar"><div class="fill" style="width:${widthPct}%"></div></div>
      <div style="margin-top:6px">${g.layer_names.slice(0,12).map(l=>`<span class="glayer">${esc(l.split('.').slice(-2).join('.'))}</span>`).join('')}${g.num_layers>12?`<span class="glayer">…+${g.num_layers-12}</span>`:''}</div>
    </div>`;
  }).join('');
  const packedHtml = m.layout==='packed' ? `<h3>物理张量计划（packed 单 slab）</h3>
    <div class="tplan"><div class="trow">block_stride = <b>${fmtBytes(m.tensors[0].block_stride)}</b> · 每个 block 内逐层偏移：</div>
      <div class="slab" style="height:34px">${m.tensors.slice(0,16).map((t,i)=>`<div class="seg" style="left:${(t.offset/m.tensors[0].block_stride*100).toFixed(1)}%;width:${Math.max(1.5,(t.page_size/m.tensors[0].block_stride*100)).toFixed(1)}%" title="${esc(t.shared_by[0])} @ ${t.offset}B，宽 ${fmtBytes(t.page_size)}"></div>`).join('')}</div>
      <div class="cap">每个竖条 = 一个字节偏移处的层组（offset → offset+最宽层页）。不同组（不同颜色）的层可在同一偏移重叠：一个物理 block 同一时刻只属于一个组，故各组布局可复用同一块区间。</div>
    </div>` : '';
  const kpis = `
    <div class="kpi"><div class="v">${m.num_blocks.toLocaleString()}</div><div class="l">num_blocks</div></div>
    <div class="kpi"><div class="v">${m.num_tensors}</div><div class="l">KV 张量数</div></div>
    <div class="kpi"><div class="v">${m.groups.length}</div><div class="l">kv_cache_group</div></div>
    <div class="kpi"><div class="v">${fmtBytes(m.available_memory_bytes)}</div><div class="l">KV 显存</div></div>`;
  return `<div class="mcfg">
    <div class="top"><span class="name">${esc(m.label)}</span>
      <span class="mtag ${tagCls}">${tagTxt}</span></div>
    <div class="kpis">${kpis}</div>
    <div class="note" style="font-size:12px;color:var(--muted)">${md(m.note)}</div>
    <h3>KV Cache Groups</h3>
    <div class="grow">${groupsHtml}</div>
    ${packedHtml}
  </div>`;
}

function renderCompare(modelNames){
  const ms = modelNames.map(n=>PAGE.data.models[n]);
  const maxTok = Math.max(...ms.map(m=>Math.max(...m.groups.map(g=>g.per_token_bytes))));
  const rows = ms.map(m=>{
    const rep = Math.max(...m.groups.map(g=>g.per_token_bytes));
    const pct = Math.max(3, Math.round(rep/maxTok*100));
    const tagCls = m.layout==='packed'?'packed':(m.layout==='uniform_type'?'uniform':'nbf');
    const tagTxt = m.layout==='packed'?'PACKED':(m.layout==='uniform_type'?'UNIFORM-TYPE':'NUM-BLOCKS-FIRST');
    return `<tr>
      <td class="c-model"><div class="c-name">${esc(m.label)}</div>
        <div class="c-groups">${m.groups.map(g=>`<span class="gtag">${esc(g.kind)} ${g.num_layers}层</span>`).join('')}</div></td>
      <td><span class="mtag ${tagCls}">${tagTxt}</span></td>
      <td class="num">${m.num_blocks.toLocaleString()}</td>
      <td class="num">${m.num_tensors}</td>
      <td class="num">${m.groups.length}</td>
      <td class="c-bar"><div class="mbar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="mval">峰值 ${rep.toLocaleString()} B/token</div></td>
      <td class="c-note">${md(m.note)}</td>
    </tr>`;
  }).join('');
  return `<div class="lblk"><div class="cmpbox"><table class="cmp">
    <thead><tr><th>模型</th><th>布局</th><th>num_blocks</th><th>KV 张量</th><th>组数</th><th>每 token 字节</th><th>关键点</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div></div>`;
}

function renderMemSeries(){
  const d = PAGE.data.memseries;
  const mems = d.mems;
  const maxBlocks = Math.max(...Object.values(d.models).map(m=>Math.max(...m.points.map(p=>p.num_blocks))));
  const rows = Object.entries(d.models).map(([,m])=>{
    const cells = mems.map(mem=>{
      const pt = m.points.find(p=>p.mem_gib===mem);
      return `<td class="num">${pt.num_blocks.toLocaleString()}</td>`;
    }).join('');
    const last = m.points[m.points.length-1];
    const pct = Math.max(4, Math.round(last.num_blocks/maxBlocks*100));
    return `<tr>
      <td class="c-model"><div class="c-name">${esc(m.label)}</div></td>
      <td class="num">${m.rep_per_token.toLocaleString()}</td>
      ${cells}
      <td class="c-bar"><div class="mbar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="mval">${last.mem_gib} GiB 时 ${last.num_blocks.toLocaleString()} 块</div></td>
    </tr>`;
  }).join('');
  return `<div class="lblk"><div class="memcmp">
    <div class="memnote" style="font-size:12px;color:var(--muted);margin-bottom:10px">每个模型在同一组显存预算（${esc(mems.join(' / '))} GiB）下的 <code>num_blocks</code>。块容量随显存线性增长，斜率 ≈ 1 ÷ 每 token 字节。</div>
    <div class="cmpbox"><table class="cmp">
      <thead><tr><th>模型</th><th>每 token 峰值</th>${mems.map(m=>`<th>${m} GiB</th>`).join('')}<th>容量（16 GiB）</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div></div>`;
}

function renderDia(kind, data, step){
  switch(kind){
    case 'stride_order': return `<div class="dia">
      <p style="font-size:12.5px;color:#c3cee0;margin-bottom:8px">逻辑形状 <code>(B, H, N, C)</code>：
        B=块数，H=K/V head 数，N=block_size，C=2·head_size（K‖V）。</p>
      <div class="dimrow"><span class="dim">B <b>(最慢)</b></span><span class="arrow">·</span>
        <span class="dim">H</span><span class="arrow">·</span>
        <span class="dim">N</span><span class="arrow">·</span>
        <span class="dim">C=<b>2D</b></span></div>
      <div class="cap">物理内存按『哪个维最慢变化』决定：num-blocks-first = B 在最外层（最慢），一个块一个块连续排布。</div></div>`;
    case 'stride_variants': return `<div class="dia">
      <table class="tbl">
        <thead><tr><th>布局</th><th>物理排列</th><th>stride_order（从逻辑 (B,H,N,2D)）</th></tr></thead>
        <tbody>
          <tr><td>NHD（最常见）</td><td><code>(B, N, H, 2D)</code></td><td><code>(0,2,1,3)</code></td></tr>
          <tr><td>NHD + 层维</td><td><code>(B, L, N, H, 2D)</code></td><td><code>(1,0,3,2,4)</code></td></tr>
          <tr><td>HND</td><td><code>(B, H, N, 2D)</code></td><td><code>(0,1,2,3)</code></td></tr>
          <tr><td>HND + 层维</td><td><code>(B, H, L, N, 2D)</code></td><td><code>(1,2,0,3,4)</code></td></tr>
          <tr><td>ROCM kv-first</td><td><code>(2, B, N, H, D)</code>（K/V 分居两块）</td><td>block_dim=1</td></tr>
        </tbody>
      </table>
      <div class="cap">L=层维（打包进跨越的多层共享张量时）；ROCM 的 kv-first 把 K 与 V 放在两个远离的块半区。</div></div>`;
    case 'shared_pool': return `<div class="dia">
      <p style="font-size:12px;color:#c3cee0;margin-bottom:8px">多组共享池：<code>group_size</code> 个物理池，每组第 j 层共享第 j 个池。</p>
      <div class="chaintable">
        <div class="chainrow"><span class="k">池 0</span><span class="v">full.0 / sw.0 / sw.1</span></div>

      </div>
      <div class="cap">每个池大小 = <code>page_size × num_blocks</code>，块 id 跨组重叠（同一块分属不同组的一层）。</div></div>`;
    case 'packed': return `<div class="dia">
      <p style="font-size:12px;color:#c3cee0;margin-bottom:6px">packed：所有组叠进同一 slab，每层在块内有字节 <code>offset</code>，块步长 <code>block_stride</code>。</p>
      <div class="slab" style="height:40px"><div class="seg" style="left:0;width:25%"></div><div class="seg" style="left:30%;width:18%"></div><div class="seg" style="left:55%;width:30%"></div><div class="seg" style="left:90%;width:8%"></div></div>
      <div class="cap">块 b 的物理地址 = base + b·block_stride + layer_offset。层页大小不同也能共存。</div></div>`;
    case 'swa': return `<div class="dia">
      <p style="font-size:12px;color:#c3cee0;margin-bottom:8px">滑窗：<span class="wtok out">×</span> 窗口外（null 块，已释放）· <span class="wtok in">t</span> 窗口内 · <span class="wtok cur">▸</span> 当前 token</p>
      <div class="winrow">${'<span class="wtok out">×</span>'.repeat(6)}<span class="wtok in">t</span><span class="wtok in">t</span><span class="wtok cur">▸</span></div>
      <div class="cap">窗口固定保留最近 N 个 token 的 KV；更早的块从 BlockTable 中换成 null 块并归还块池。</div></div>`;
    case 'mla': return `<div class="dia">
      <p style="font-size:12px;color:#c3cee0;margin-bottom:8px">MLA 每 token 缓存 = 压缩潜在 <code>kv_lora</code>(512) + RoPE <code>k_rope</code>(64)，num_kv_heads=1。</p>
      <div class="dimrow"><span class="dim">kv_lora <b>512</b></span><span class="arrow">+</span><span class="dim">k_rope <b>64</b></span></div>
      <div class="cap">head_size=576；fp8_ds_mla 下每 token 656B（V3）或 584B（V4，含 8B fp8 scale）。</div></div>`;
    case 'mamba': return `<div class="dia">
      <p style="font-size:12px;color:#c3cee0;margin-bottom:8px">Mamba 每块存一段状态（conv + ssm），非 token 化 KV。</p>
      <div class="dimrow"><span class="dim">[B, <b>1</b>, <b>1</b>, page_bytes]</span><span class="arrow">=</span><span class="dim">每块一个状态页</span></div>
      <div class="cap">align 模式让 Mamba 状态块与注意力块边界对齐，块 table 行按序列位置索引。</div></div>`;
    case 'hybrid_groups': return `<div class="dia">
      <p style="font-size:12px;color:#c3cee0;margin-bottom:8px">一组 BlockPool、多组 block table：</p>
      <div class="chaintable">
        <div class="chainrow"><span class="k">group0</span><span class="v hl">Mamba</span><span class="v">→ block table 0</span></div>
        <div class="chainrow"><span class="k">group1</span><span class="v hl">FullAttn</span><span class="v">→ block table 1</span></div>
        <div class="chainrow"><span class="k">pool</span><span class="v">KVCacheBlock[0..N]（共享）</span></div>
      </div>
      <div class="cap">块 id 由 BlockPool 全局分配，但各组各自记录自己的块序列。</div></div>`;
    case 'slot_chain': return `<div class="dia">
      <div class="chaintable">
        <div class="chainrow"><span class="k">pos</span><span class="v">序列第 p 个 token</span></div>
        <div class="chainrow"><span class="k">÷block</span><span class="v hl">manager block idx</span><span class="conv">→ BlockPool → <span class="conv_var">manager block_id</span></span></div>
        <div class="chainrow"><span class="k">×bpk</span><span class="v hl">kernel block id</span><span class="conv">= block_id·bpk + k</span></div>
        <div class="chainrow"><span class="k">slot</span><span class="v hl">物理 slot</span><span class="conv">= kernel_id·kernel_bs + off</span></div>
        <div class="chainrow"><span class="k">addr</span><span class="v">base + layer_offset + slot·stride</span></div>
      </div>
    </div>`;
    default: return '';
  }
}

// Mapping demos keep their own step state keyed by a unique element id. Each
// instance renders into a real DOM node (#mm-N) so "上一步/下一步" updates the
// visible block, not a detached element.
const mmState = {};
// 清理已不在 DOM 中的 mapping demo 状态，避免多次翻页后内存残留
function pruneMM(){ for(const id in mmState){ if(!document.getElementById(id)) delete mmState[id]; } }
function renderMapping(m){
  const steps = m.steps;
  const reqKeys = Object.keys(steps[0].requests);
  const id = 'mm-' + Math.random().toString(36).slice(2,8);
  const state = { si:0, steps, reqKeys, m, id };
  mmState[id] = state;
  // 第 0 步 = 初始 prefill：全部 token 一次写入，都视为"本步新写入"（黄色），
  // 这样 prefill 阶段在视觉上一眼可辨；图例文案会在第 0 步切换为"初始 prefill"。
  state.isNewAt = function(rid,pos){
    if(state.si===0) return true;
    const prev=steps[state.si-1].requests[rid];
    const p=prev&&prev.slot_map?prev.slot_map[pos]:null;
    return !p || p.slot<0;
  };
  // 每个请求的 kernel 块网格：每格 = 一个物理 slot（格内 pos、下方 slot 号）。
  state.gridHtml = function(rid, info, sm){
    const kbs = state.m.kernel_block_size;
    const byKb = {};
    for(const s of sm){ (byKb[s.kernel_block_id] = byKb[s.kernel_block_id]||[]).push(s); }
    const last = sm.length? sm[sm.length-1] : null;
    const blocks = (info.kernel_blocks||[]).map(kb=>{
      const occ = byKb[kb]||[];
      const cells = [];
      for(let off=0; off<kbs; off++){
        const slot = kb*kbs+off;
        const s = occ.find(o=>o.slot>=0 && o.slot%kbs===off);
        cells.push(s
          ? `<span class="mkslot ${state.isNewAt(rid,s.pos)?'new':''} ${last&&s.pos===last.pos?'cur':''}"><i>${s.pos}</i><b>${slot}</b></span>`
          : `<span class="mkslot empty"><i>·</i><b>${slot}</b></span>`);
      }
      return `<div class="mkblk"><div class="mkbhead">kernel 块 <b>${kb}</b></div><div class="mkbody">${cells.join('')}</div></div>`;
    }).join('');
    return blocks
      ? `<div class="mgridlab">物理 slot 网格：格内 = token pos，下方 = 物理 slot 号</div><div class="mkgrid">${blocks}</div>`
      : '';
  };
  state.chainHtml = function(){
    const st = steps[state.si];
    return `<div class="mchain">`+reqKeys.map((rid)=>{
      const info = st.requests[rid] || {slot_map:[], computed:0};
      const sm = info.slot_map || [];
      const last = sm.length? sm[sm.length-1] : null;
      const toks = sm.map((s,idx)=>`<span class="ctok ${state.isNewAt(rid,s.pos)?'new':''} ${idx===sm.length-1?'cur':''}" title="pos ${s.pos}">${s.pos}</span>`).join('');
      const path = last ? `<div class="cpath">
          <span class="pn">pos <b>${last.pos}</b></span><span class="pconn">→</span>
          <span class="pn">mgr 块 <b>${last.manager_block_id}</b></span><span class="pconn">→</span>
          <span class="pn">kernel 块 <b>${last.kernel_block_id}</b></span><span class="pconn">→</span>
          <span class="pn slot">slot <b>${last.slot}</b></span></div>` : (sm.length===0 ? `<div class="cpath"><span class="pn">等待调度（尚未分配块）</span></div>` : '');
      return `<div class="creq">
        <div class="chead">请求 <b style="color:var(--gpu)">${esc(rid)}</b> · computed ${info.computed} tokens · 路径取最后写入的 token（绿色）</div>
        <div class="ctoks">${toks}</div>${path}${state.gridHtml(rid, info, sm)}</div>`;
    }).join('')+`</div>`;
  };
  state.tableHtml = function(){
    const st = steps[state.si];
    let h = `<tr><th>req</th><th>pos</th><th>mgr blk</th><th>kernel blk</th><th>slot</th></tr>`;
    let rows='';
    for(const rid of reqKeys){
      for(const sm of (st.requests[rid]||{slot_map:[]}).slot_map || []){
        const isNew = state.isNewAt(rid,sm.pos);
        rows+=`<tr><td style="color:var(--gpu)">${esc(rid)}</td><td>${sm.pos}</td>
          <td>${sm.manager_block_id}</td>
          <td class="${isNew?'hl':''}">${sm.kernel_block_id}</td>
          <td class="slot${isNew?' hl':''}">${sm.slot}</td></tr>`;
      }
    }
    return `<table class="slottab">${h}${rows}</table>`;
  };
  state.inner = function(){
    const si = state.si; const st = steps[si];
    return `<div class="mctrl">
        <button ${si<=0?'disabled':''} onclick="mmStep('${id}',-1)">‹ 上一步</button>
        <button ${si>=steps.length-1?'disabled':''} onclick="mmStep('${id}',1)">下一步 ›</button>
        <span class="mstep" role="status">调度步 <b>${si}</b>/${steps.length-1} · ${st.phase?esc(st.phase)+' · ':''}block_size=${m.block_size} · kernel_block_size=${m.kernel_block_size} · bpk=${m.bpk}</span>
      </div>
      ${state.chainHtml()}
      ${state.tableHtml()}
      <div class="cap">${si===0?'黄色 = 初始 prefill 一次写入的全部 token（第 0 步为初始分配，无上一步对比）。':'黄色 = 本步新写入（相对上一步新增）。'}物理 slot 直接索引 num-blocks-first 张量的块维：slot = kernel_block_id·kernel_bs + offset。</div>`;
  };
  return `<div class="mmap lblk" id="${id}">${state.inner()}</div>`;
}
window.mmStep = function(id,d){
  const s = mmState[id]; if(!s) return;
  s.si = Math.max(0, Math.min(s.steps.length-1, s.si+d));
  const el = document.getElementById(id);
  if(el) el.innerHTML = s.inner();
};

/* ---------- boot ---------- */
parseHash();
render();
document.getElementById('menuBtn').addEventListener('click', ()=>{
  const o=document.getElementById('outline');
  if(o.classList.contains('open')) closeOutline(); else openMenu();
});
document.addEventListener('keydown', e=>{
  if(e.target && e.target.matches && e.target.matches('input,select,textarea')) return;
  if(e.key==='ArrowRight') goSectionTo(curCh,curSec+1);
  else if(e.key==='ArrowLeft') goSectionTo(curCh,curSec-1);
  else if(e.key==='ArrowDown') goChapter(curCh+1);
  else if(e.key==='ArrowUp') goChapter(curCh-1);
  else if(e.key==='Escape') closeOutline();
});
window.addEventListener('hashchange', ()=>{
  parseHash(); render();
  const story=document.getElementById('story'); if(story) story.scrollIntoView({block:'start',behavior:reduced?'auto':'smooth'});
});
</script>
